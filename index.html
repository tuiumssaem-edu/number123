*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bar);color:var(--ink);overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
nav{flex:0 0 auto;display:flex;gap:8px;padding:8px 10px;background:var(--bar);border-bottom:2px solid var(--line)}
.tab{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;
  border:3px solid var(--line);background:var(--off);color:var(--ink);border-radius:16px;
  padding:8px 6px;font:inherit;font-size:20px;font-weight:400;box-shadow:0 4px 0 var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab .no{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.tab .ic{font-size:24px;line-height:1}
.tab .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.tab[aria-selected="true"] .no{background:#fff;color:var(--c)}
.tab:focus-visible{outline:4px solid var(--c);outline-offset:2px}
main{flex:1 1 auto;position:relative;min-height:0}
.tab.home{flex:0 0 auto;width:64px}
#cover{position:absolute;inset:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:14px;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.6px);background-size:26px 26px}
.cv{max-width:860px;width:100%;text-align:center;padding-top:60px} /* 앱의 맨 윗줄(52px+8px)과 같은 자리 */
.cv-deco{display:flex;justify-content:center;gap:10px;margin:8px 0 0;height:52px;align-items:center}
.cv-deco span{width:52px;height:52px;border-radius:16px;color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:rotate(var(--r));box-shadow:0 5px 0 rgba(0,0,0,.12)}
.cv h1{margin:0;font-size:clamp(38px,8vw,56px);font-weight:400;height:62px;line-height:62px}
.cv-head{min-height:124px;margin-bottom:18px}
.cv-sub{display:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px 18px;border-radius:24px;border:3px solid var(--line);background:var(--bar);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 6px 0 var(--line);transition:transform .08s}
.card:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.card:focus-visible{outline:4px solid var(--c);outline-offset:3px}
.cno{position:absolute;top:12px;left:14px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.cic{width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,transparent);display:flex;align-items:center;justify-content:center;font-size:50px;line-height:1}
.cname{font-size:26px;margin-top:4px}
.cdesc{font-size:17px;color:var(--muted)}
.cv-note{margin:26px 0 0;color:var(--muted);font-size:16px}
@media (max-width:520px){.cv h1{height:44px;line-height:44px}.cv-head{min-height:104px}.cv-deco{height:44px}}
@media (max-width:560px){.cards{grid-template-columns:1fr;gap:12px}.card{flex-direction:row;padding:14px 14px 14px 54px;text-align:left}.cic{width:60px;height:60px;font-size:34px}.cname{font-size:20px}.card .cdesc{display:none}.cv-deco span{width:44px;height:44px;font-size:20px}.tab.home{width:52px}}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
@media (max-width:560px){
  nav{gap:6px;padding:6px}
  .tab{flex-direction:column;gap:2px;font-size:14px;padding:6px 2px;border-radius:12px;position:relative}
  .tab .no{position:absolute;top:3px;left:4px;width:20px;height:20px;font-size:12px}
  .tab .ic{font-size:22px}
  .tab .lb{white-space:normal;text-align:center;line-height:1.15}
}
</style>
</head>
<body>

</nav>

    <p class="cv-note">초등학교 1학년 수학 · 50까지의 수<br>1번부터 차례대로 해 보세요. 선생님 설정은 각 놀이 첫 화면 오른쪽 위 ⚙️에 있어요.</p>

.wrap{max-width:860px;margin:0 auto;padding:14px}
.screen{display:none}
.screen.on{display:block}
.push{box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s}

/* 처음 화면 */
.home-top{display:flex;justify-content:flex-end}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.panel{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:18px 14px}
.say{font-size:30px;text-align:center;margin:0 0 16px;min-height:1.4em}
.say .n{font-size:44px;color:var(--base)}
.say .lt{color:var(--less)} .say .gt{color:var(--more)}

/* 수직선 징검다리 */
.line{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:58px 0 8px;position:relative}
.stone{position:relative;min-width:88px;height:88px;border-radius:50%/42%;background:var(--soft);border:4px solid var(--line);font-size:40px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.stone.base{border-color:var(--base);background:var(--base);color:#fff}
.stone.q{border-style:dashed;background:var(--card);color:var(--muted)}
.stone.q.lt{border-color:var(--less)} .stone.q.gt{border-color:var(--more)}
.stone.got.lt{background:var(--less);border-color:var(--less);color:#fff;border-style:solid}
.stone.got.gt{background:var(--more);border-color:var(--more);color:#fff;border-style:solid}
.stone.got.nx{background:var(--sun);border-color:var(--sun);color:#3A2A00;border-style:solid}
.stone.q.nx{border-color:var(--sun)}
.char{position:absolute;top:-56px;left:50%;transform:translateX(-50%);font-size:46px;line-height:1}
.char.hop{animation:hop .5s ease}
@keyframes hop{0%{transform:translate(-50%,0)}40%{transform:translate(-50%,-30px)}100%{transform:translate(-50%,0)}}
.tag{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:20px}
.tag.lt{color:var(--less)} .tag.gt{color:var(--more)}
.line.tagged{padding-bottom:40px}

.choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.choice{min-width:118px;font-size:46px;padding:12px 22px;border-radius:20px;border:3px solid var(--line);background:var(--bg)}
.choice.right{background:var(--good);border-color:var(--good);color:#fff}
.choice.nope{opacity:.3;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.next{display:block;margin:20px auto 0;font-size:32px;padding:12px 44px;border-radius:18px;border:none;background:var(--good);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}

.car.engine .smoke{position:absolute;top:-40px;left:8px;font-size:30px}
.car.filled{background:var(--sun);border-color:var(--sun);color:#3A2A00}
.car.cur{border-style:dashed;border-color:var(--sun);background:var(--card);animation:glow 1.2s infinite}

.say{font-size:28px!important;line-height:1.3!important;color:var(--t-ink)}
/* 처음 화면 */
.home-title h1,.title h1{font-size:clamp(38px,8vw,56px)!important;font-weight:400!important;color:var(--t-ink)!important;text-shadow:none!important;letter-spacing:0!important;line-height:1.1!important}
.menu{gap:16px!important}
.menu button{background:var(--t-card)!important;border:3px solid var(--t-line)!important;border-radius:24px!important;box-shadow:0 6px 0 var(--t-line)!important;font-size:26px!important;color:var(--t-ink)!important}
.menu button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--t-line)!important}
.menu button .ic{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px!important;background:var(--acc-soft)}
/* 보기 버튼 (모든 놀이 같은 모양) */
.choice{background:var(--t-card)!important;color:var(--t-ink)!important;border:3px solid var(--t-line)!important;border-radius:22px!important;box-shadow:0 6px 0 var(--t-line)!important;font-size:46px!important;line-height:1.1!important;min-width:112px!important;padding:12px 22px!important;transform:none}
.choice:active{transform:translateY(4px)!important;box-shadow:0 2px 0 var(--t-line)!important}
.choice.right{background:var(--t-good)!important;border-color:var(--t-good)!important;color:#fff!important;box-shadow:0 6px 0 rgba(0,0,0,.15)!important}
/* 다음 버튼 */
.next,.big-btn{background:var(--t-good)!important;color:#fff!important;border:none!important;border-radius:999px!important;font-size:28px!important;padding:12px 38px!important;box-shadow:0 6px 0 rgba(0,0,0,.15)!important}
.big-btn.sub{background:var(--t-card)!important;color:var(--t-ink)!important;border:3px solid var(--t-line)!important;box-shadow:0 6px 0 var(--t-line)!important}
/* 칭찬 */
#party div{background:var(--t-card)!important;border:5px solid var(--acc)!important;border-radius:28px!important;font-size:40px!important;padding:18px 36px!important;color:var(--t-ink)!important}
/* 선생님 설정 */
.set-item{background:var(--t-card)!important;border:3px solid var(--t-line)!important;border-radius:22px!important}
.set-item h3{font-size:22px!important;font-weight:400!important;margin-bottom:2px!important}
.pill{border:2px solid var(--t-line)!important;background:var(--t-bg)!important;color:var(--t-ink)!important;border-radius:999px!important;padding:7px 16px!important;font-size:19px!important;line-height:1.3!important}
.pill.on{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important}
/* 첫 화면 틀 (세 앱 같은 위치) */
.wrap{max-width:860px!important;padding:14px!important}
.home-top{display:flex!important;align-items:center!important;justify-content:flex-start!important;min-height:52px!important;margin:0 0 8px!important}
.home-top .gear{margin-left:auto!important}
.home-title,.title{margin:0 0 18px!important;min-height:124px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;text-align:center!important}

&lt;script&gt;
/* ---------- 도구 ---------- */
const $=s=&gt;document.getElementById(s);
const rand=(a,b)=&gt;Math.floor(Math.random()*(b-a+1))+a;
const pick=a=&gt;a[Math.floor(Math.random()*a.length)];
const shuffle=a=&gt;{for(let i=a.length-1;i&gt;0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const PRAISE=[&#x27;🎉 잘했어요!&#x27;,&#x27;👏 최고예요!&#x27;,&#x27;🌟 맞았어요!&#x27;,&#x27;😊 멋져요!&#x27;];
const KEY=&#x27;order-&#x27;;
/* 숫자 뒤 조사: 일·삼·육·칠·팔·십·백처럼 받침이 있으면 &#x27;이에요&#x27; */
const ieyo=n=&gt;[0,1,3,6,7,8].includes(n%10)?n+&#x27;이에요&#x27;:n+&#x27;예요&#x27;;

const S={range:20,count:3,sound:true,fx:true,voice:&#x27;&#x27;,rate:0.9,stars:0};
try{
  const r=Number(localStorage.getItem(KEY+&#x27;range&#x27;));if([10,20,50,100].includes(r))S.range=r;
  const c=Number(localStorage.getItem(KEY+&#x27;count&#x27;));if([3,5].includes(c))S.count=c;
  const s=localStorage.getItem(KEY+&#x27;sound&#x27;);if(s!==null)S.sound=s===&#x27;1&#x27;;
  const f=localStorage.getItem(KEY+&#x27;fx&#x27;);if(f!==null)S.fx=f===&#x27;1&#x27;;
  S.voice=localStorage.getItem(KEY+&#x27;voice&#x27;)||&#x27;&#x27;;
  const rt=Number(localStorage.getItem(KEY+&#x27;rate&#x27;));if([0.75,0.9,1.05].includes(rt))S.rate=rt;
  [&#x27;stars&#x27;].forEach(k=&gt;{const v=localStorage.getItem(KEY+k);if(v!==null&amp;&amp;!isNaN(+v))S[k]=+v;});
}catch(e){}
function save(k,v){try{localStorage.setItem(KEY+k,String(v));}catch(e){}}

/* ---------- 목소리 ---------- */
let lastSpeech=&#x27;&#x27;,koVoices=[];
function voiceScore(v){
  const n=v.name;let sc=0;
  if(/Natural|Neural/i.test(n))sc+=60;
  if(/Premium|Enhanced|고급|향상/i.test(n))sc+=50;
  if(/Online/i.test(n))sc+=20;
  if(/Google/i.test(n))sc+=35;
  if(/Yuna|유나|SunHi|선희|Heami|해미|InJoon|인준|Hyunsu|Sora/i.test(n))sc+=15;
  return sc;
}
function bestVoice(){
  if(!koVoices.length)return null;
  return koVoices.find(v=&gt;v.voiceURI===S.voice)||[...koVoices].sort((a,b)=&gt;voiceScore(b)-voiceScore(a))[0];
}
function loadVoices(){
  try{koVoices=speechSynthesis.getVoices().filter(v=&gt;/^ko/i.test(v.lang)||/Korean|한국/i.test(v.name));}catch(e){koVoices=[];}
  const sel=$(&#x27;voice-sel&#x27;);sel.innerHTML=&#x27;&#x27;;
  const auto=document.createElement(&#x27;option&#x27;);auto.value=&#x27;&#x27;;auto.textContent=&#x27;자동 (가장 자연스러운 목소리)&#x27;;sel.appendChild(auto);
  [...koVoices].sort((a,b)=&gt;voiceScore(b)-voiceScore(a)).forEach(v=&gt;{const o=document.createElement(&#x27;option&#x27;);o.value=v.voiceURI;o.textContent=v.name;sel.appendChild(o);});
  sel.value=koVoices.some(v=&gt;v.voiceURI===S.voice)?S.voice:&#x27;&#x27;;
  const b=bestVoice();
  $(&#x27;voice-note&#x27;).textContent=!(&#x27;speechSynthesis&#x27; in window)?&#x27;이 브라우저는 목소리 기능을 지원하지 않아요.&#x27;
    :b?`지금 쓰는 목소리: ${b.name}`:&#x27;이 기기에서 한국어 목소리를 찾지 못했어요. 엣지(Edge)나 크롬(Chrome)에서 열어 보세요.&#x27;;
}
try{if(&#x27;speechSynthesis&#x27; in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}}catch(e){}
function say(text){
  lastSpeech=text;
  if(!S.sound)return;
  try{
    if(!(&#x27;speechSynthesis&#x27; in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=bestVoice();if(v)u.voice=v;
    u.lang=v?v.lang:&#x27;ko-KR&#x27;;u.rate=S.rate;u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 화면 문장(html)과 읽을 말 */
function show(html,speech){
  const cur=document.querySelector(&#x27;.screen.on .say&#x27;);
  if(cur)cur.innerHTML=html;

}

/* ---------- 효과음 ---------- */
let actx=null;
function ac(){
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}
  if(actx.state===&#x27;suspended&#x27;)actx.resume();
  return actx;
}
function tone(freq,start,dur,type,vol,slideTo){
  const c=ac();if(!c)return;
  const t=c.currentTime+start,o=c.createOscillator(),g=c.createGain();
  o.type=type||&#x27;sine&#x27;;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
const SFX={
  pop(){tone(520,0,0.13,&#x27;sine&#x27;,0.3,880);},
  hop(){tone(300,0,0.18,&#x27;sine&#x27;,0.3,900);tone(900,0.18,0.12,&#x27;sine&#x27;,0.15,600);},
  step(){tone(660,0,0.15,&#x27;triangle&#x27;,0.28);tone(990,0.08,0.18,&#x27;triangle&#x27;,0.18);},
  right(){[523,659,784].forEach((f,i)=&gt;tone(f,i*0.11,0.3,&#x27;triangle&#x27;,0.28));},
  wrong(){tone(330,0,0.2,&#x27;sine&#x27;,0.15,262);},
  train(){[0,.22,.44,.66].forEach(t=&gt;tone(180,t,0.12,&#x27;square&#x27;,0.08,120));tone(880,0.85,0.5,&#x27;triangle&#x27;,0.22);tone(1100,0.85,0.5,&#x27;triangle&#x27;,0.14);},
  fanfare(){[523,523,659,784,659,784,1047].forEach((f,i)=&gt;tone(f,[0,.15,.3,.45,.65,.8,1][i],i===6?0.6:0.18,&#x27;triangle&#x27;,0.28));}
};
function sfx(name){if(!S.fx)return;try{SFX[name]();}catch(e){}}

let partyTimer=null;
function party(msg,snd){
  sfx(snd||&#x27;right&#x27;);
  const p=$(&#x27;party&#x27;);$(&#x27;party-text&#x27;).textContent=msg||pick(PRAISE);

/* ---------- 별 모으기 (강화) ---------- */
function friendOr(def){return def;}
function paintBars(bump){
  document.querySelectorAll(&#x27;.star-count&#x27;).forEach(e=&gt;{e.textContent=S.stars;if(bump){const p=e.parentElement;p.classList.remove(&#x27;bump&#x27;);void p.offsetWidth;p.classList.add(&#x27;bump&#x27;);}});
}

let streak=0;
/* 정답 보상: 별 1개, 처음에 바로 3번 연속 맞히면 보너스 별 */
function correct(firstTry,quiet){
  let add=1,msg=null;
  if(firstTry){streak++;if(streak%3===0){add=2;msg=&#x27;🔥 3번 연속! 별 2개!&#x27;;}}else streak=0;
  if(quiet){if(msg)party(msg);else sfx(&#x27;step&#x27;);}else party(msg);
  setTimeout(()=&gt;addStars(add),quiet?0:400);
}
/* 3지선다: 맞을 때까지 다시 고를 수 있어요 */
function makeChoices(box,list,answer,onRight){
  box.innerHTML=&#x27;&#x27;;let done=false,miss=0;
  list.forEach(v=&gt;{
    const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;choice push&#x27;;b.textContent=v;
    b.addEventListener(&#x27;click&#x27;,()=&gt;{
      if(done||b.classList.contains(&#x27;nope&#x27;))return;
      if(v===answer){done=true;b.classList.add(&#x27;right&#x27;);say(String(v));onRight(miss===0);}
      else{miss++;sfx(&#x27;wrong&#x27;);b.classList.add(&#x27;nope&#x27;);say(&#x27;다시 골라 볼까요?&#x27;);}
    });

  });
}
/* 정답 + 헷갈리기 쉬운 수 2개 (보여 준 수를 먼저 넣어요) */
function opts(ans,first){
  const s=new Set([ans]);
  const cands=[first,...shuffle([ans-1,ans+1,ans+2,ans-2])];
  for(const x of cands){if(s.size&gt;=3)break;if(x&gt;=1&amp;&amp;x&lt;=S.range&amp;&amp;!s.has(x))s.add(x);}
  for(const x of [ans+1,ans+2,ans+3,ans-1]){if(s.size&gt;=3)break;if(x&gt;=1&amp;&amp;!s.has(x))s.add(x);}
  return [...s].sort((a,b)=&gt;a-b);
}

/* 징검다리 그리기 */
function renderLine(box,nums,o){
  box.innerHTML=&#x27;&#x27;;
  nums.forEach((n,i)=&gt;{
    const st=document.createElement(&#x27;button&#x27;);st.className=&#x27;stone&#x27;;

    st.textContent=isQ&amp;&amp;!o.revealed?&#x27;?&#x27;:n;
    st.setAttribute(&#x27;aria-label&#x27;,isQ&amp;&amp;!o.revealed?&#x27;물음표&#x27;:String(n));
    st.addEventListener(&#x27;click&#x27;,()=&gt;say(isQ&amp;&amp;!o.revealed?&#x27;무엇일까요?&#x27;:String(n)));
    if(o.char&amp;&amp;i===o.charAt){const c=document.createElement(&#x27;span&#x27;);c.className=&#x27;char&#x27;+(o.hop?&#x27; hop&#x27;:&#x27;&#x27;);c.textContent=o.char;st.appendChild(c);}
    if(isQ&amp;&amp;o.tag){const t=document.createElement(&#x27;span&#x27;);t.className=&#x27;tag &#x27;+o.kind;t.textContent=o.tag;st.appendChild(t);}
    box.appendChild(st);
  });
}

/* ---------- 1 큰 수 / 1 작은 수 ---------- */
const st={mode:&#x27;big&#x27;};
function stepNew(){
  const R=S.range,big=st.mode===&#x27;big&#x27;;
  let n,ans,nums,q,base;
  if(big){
    n=rand(1,R-1);ans=n+1;nums=[];
    for(let x=Math.max(1,n-2);x&lt;=n;x++)nums.push(x);
    nums.push(ans);q=nums.length-1;base=nums.length-2;
  }else{
    n=rand(2,R);ans=n-1;nums=[ans];
    for(let x=n;x&lt;=n+2;x++)nums.push(x);
    q=0;base=1;
  }
  const kind=big?&#x27;gt&#x27;:&#x27;lt&#x27;,tag=big?&#x27;1 큰 수 ▶&#x27;:&#x27;◀ 1 작은 수&#x27;,ch=friendOr(big?&#x27;🐰&#x27;:&#x27;🐢&#x27;);
  $(&#x27;step-title&#x27;).textContent=big?&#x27;🐰 1 큰 수&#x27;:&#x27;🐢 1 작은 수&#x27;;
  const lineOpt={q,base,kind,tag,char:ch,charAt:base,revealed:false};
  renderLine($(&#x27;step-line&#x27;),nums,lineOpt);
  $(&#x27;step-next&#x27;).hidden=true;
  show(`&lt;span class=&quot;n&quot;&gt;${n}&lt;/span&gt;보다 &lt;span class=&quot;${kind}&quot;&gt;1 ${big?&#x27;큰&#x27;:&#x27;작은&#x27;} 수&lt;/span&gt;는?`,
       `${n}보다 1 ${big?&#x27;큰&#x27;:&#x27;작은&#x27;} 수는 무엇일까요?`);
  makeChoices($(&#x27;step-choices&#x27;),opts(ans,n),ans,first=&gt;{
    setTimeout(()=&gt;{
      renderLine($(&#x27;step-line&#x27;),nums,{...lineOpt,revealed:true,charAt:q,hop:true});
      sfx(&#x27;hop&#x27;);
      setTimeout(()=&gt;{
        correct(first);
        show(`&lt;span class=&quot;n&quot;&gt;${n}&lt;/span&gt;보다 1 ${big?&#x27;큰&#x27;:&#x27;작은&#x27;} 수는 &lt;span class=&quot;${kind}&quot; style=&quot;font-size:44px&quot;&gt;${ans}&lt;/span&gt;${ieyo(ans).slice(String(ans).length)}.`,
             `맞아요! ${n}보다 1 ${big?&#x27;큰&#x27;:&#x27;작은&#x27;} 수는 ${ieyo(ans)}.`);

    },350);
  });
}
$(&#x27;step-next&#x27;).addEventListener(&#x27;click&#x27;,stepNew);

/* ---------- 이어 세기 ---------- */
const ct={start:1,k:3,idx:1};
function contRender(go){
  const tr=$(&#x27;cont-train&#x27;);tr.innerHTML=&#x27;&#x27;;tr.classList.remove(&#x27;go&#x27;);
  for(let i=0;i&lt;=ct.k;i++){

    else if(i===ct.idx){c.classList.add(&#x27;cur&#x27;);c.textContent=&#x27;?&#x27;;}

  }
  if(go){void tr.offsetWidth;tr.classList.add(&#x27;go&#x27;);}
}
function contNew(){
  ct.k=S.count;ct.start=rand(1,Math.max(1,S.range-ct.k));ct.idx=1;

  show(`&lt;span class=&quot;n&quot;&gt;${ct.start}&lt;/span&gt;부터 이어 세어요. 다음 수는?`,`${ct.start}부터 이어 세어 볼까요? ${ct.start} 다음은 무엇일까요?`);
  contAsk();
}
function contAsk(){
  const ans=ct.start+ct.idx;
  makeChoices($(&#x27;cont-choices&#x27;),opts(ans,ans-1),ans,first=&gt;{
    ct.idx++;correct(first,true);
    if(ct.idx&gt;ct.k){
      contRender(true);$(&#x27;cont-choices&#x27;).innerHTML=&#x27;&#x27;;
      const all=[];for(let i=0;i&lt;=ct.k;i++)all.push(ct.start+i);

/* ---------- 맞혀 보기 ---------- */
const QN=5,qz={i:0};
function quizStart(){qz.i=0;$(&#x27;quiz-play&#x27;).hidden=false;$(&#x27;quiz-end&#x27;).hidden=true;quizShow();}

  for(let k=0;k&lt;=QN;k++){
    const d=document.createElement(&#x27;div&#x27;);d.className=&#x27;pstone&#x27;+(k&lt;=qz.i&amp;&amp;k&gt;0?&#x27; done&#x27;:&#x27;&#x27;);d.textContent=k===0?&#x27;🚩&#x27;:k;

    html=`&lt;span class=&quot;n&quot;&gt;${n}&lt;/span&gt;보다 &lt;span class=&quot;gt&quot;&gt;1 큰 수&lt;/span&gt;는?`;speech=`${n}보다 1 큰 수는?`;

  }else{
    const s=rand(1,Math.max(1,R-3));nums=[s,s+1,s+2,s+3];ans=s+3;o={q:3,base:-1,kind:&#x27;nx&#x27;};first=s+2;
    html=&#x27;다음 수는?&#x27;;speech=`${s}, ${s+1}, ${s+2}. 다음 수는?`;

    renderLine($(&#x27;quiz-line&#x27;),nums,{...o,revealed:true});
    qz.i++;quizStars(true);sfx(&#x27;hop&#x27;);setTimeout(()=&gt;correct(ok1),300);
    $(&#x27;quiz-next&#x27;).hidden=false;
  });
}
$(&#x27;quiz-next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  if(qz.i&gt;=QN){
    $(&#x27;quiz-play&#x27;).hidden=true;$(&#x27;quiz-end&#x27;).hidden=false;
    party(&#x27;💎 보물 상자 열기!&#x27;,&#x27;fanfare&#x27;);say(&#x27;보물 상자를 열었어요! 보너스 별 세 개!&#x27;);
    setTimeout(()=&gt;addStars(3),600);
  }

&lt;script&gt;
/* 묶음 파일용: 목소리·효과음·빠르기·목소리 선택을 세 앱이 함께 쓰도록 맞춰요 */
(function(){
  var APP=&quot;order&quot;;
  function store(k,v){
    try{
      if(APP===&#x27;tens&#x27;){localStorage.setItem(&#x27;t10-&#x27;+k,(k===&#x27;sound&#x27;||k===&#x27;fx&#x27;)?(v?&#x27;1&#x27;:&#x27;0&#x27;):String(v));}
      else if(APP===&#x27;order&#x27;){save(k,(k===&#x27;sound&#x27;||k===&#x27;fx&#x27;)?(v?1:0):v);}
      else{save(k,(k===&#x27;sound&#x27;||k===&#x27;fx&#x27;)?(v?&#x27;1&#x27;:&#x27;0&#x27;):String(v));}
    }catch(e){}
  }
  function snapshot(){return {sound:S.sound,fx:S.fx,rate:S.rate,voice:S.voice};}

  function later(){setTimeout(send,0);}
  var toast=document.createElement(&#x27;div&#x27;);
  toast.style.cssText=&quot;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2F9E5B;color:#fff;padding:10px 22px;border-radius:999px;font-size:20px;font-family:&#x27;Apple SD Gothic Neo&#x27;,&#x27;Malgun Gothic&#x27;,sans-serif;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;z-index:99&quot;;
  document.body.appendChild(toast);var tt=null;
  function done(b){var lab=(b.textContent||&#x27;&#x27;).replace(&#x27;✔&#x27;,&#x27;&#x27;).trim();toast.textContent=&#x27;✔ \u2018&#x27;+lab+&#x27;\u2019 선택했어요&#x27;;toast.style.opacity=&#x27;1&#x27;;clearTimeout(tt);tt=setTimeout(function(){toast.style.opacity=&#x27;0&#x27;;},1400);}
  document.addEventListener(&#x27;click&#x27;,function(e){var b=e.target.closest&amp;&amp;e.target.closest(&#x27;#settings .pill&#x27;);if(b&amp;&amp;b.id!==&#x27;voice-test&#x27;&amp;&amp;b.id!==&#x27;reset-btn&#x27;)setTimeout(function(){done(b);},0);},true);
  document.addEventListener(&#x27;click&#x27;,function(e){
    var t=e.target.closest&amp;&amp;e.target.closest(&#x27;[data-sound],[data-fx],[data-rate]&#x27;);if(t)later();
  },true);
  var sel=document.getElementById(&#x27;voice-sel&#x27;);if(sel)sel.addEventListener(&#x27;change&#x27;,later);
  window.addEventListener(&#x27;message&#x27;,function(e){

&lt;script&gt;
/* ---------- 도구 ---------- */
const $=s=&gt;document.getElementById(s);
const rand=(a,b)=&gt;Math.floor(Math.random()*(b-a+1))+a;
const pick=a=&gt;a[Math.floor(Math.random()*a.length)];
const shuffle=a=&gt;{for(let i=a.length-1;i&gt;0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const COUNT=[&#x27;&#x27;,&#x27;하나&#x27;,&#x27;둘&#x27;,&#x27;셋&#x27;,&#x27;넷&#x27;,&#x27;다섯&#x27;,&#x27;여섯&#x27;,&#x27;일곱&#x27;,&#x27;여덟&#x27;,&#x27;아홉&#x27;,&#x27;열&#x27;];
const NT=[&#x27;&#x27;,&#x27;열&#x27;,&#x27;스물&#x27;,&#x27;서른&#x27;,&#x27;마흔&#x27;,&#x27;쉰&#x27;,&#x27;예순&#x27;,&#x27;일흔&#x27;,&#x27;여든&#x27;,&#x27;아흔&#x27;];
const ST=[&#x27;&#x27;,&#x27;십&#x27;,&#x27;이십&#x27;,&#x27;삼십&#x27;,&#x27;사십&#x27;,&#x27;오십&#x27;,&#x27;육십&#x27;,&#x27;칠십&#x27;,&#x27;팔십&#x27;,&#x27;구십&#x27;];
const SO=[&#x27;&#x27;,&#x27;일&#x27;,&#x27;이&#x27;,&#x27;삼&#x27;,&#x27;사&#x27;,&#x27;오&#x27;,&#x27;육&#x27;,&#x27;칠&#x27;,&#x27;팔&#x27;,&#x27;구&#x27;];
const sino=n=&gt;n===0?&#x27;영&#x27;:ST[Math.floor(n/10)]+SO[n%10];
const PRAISE=[&#x27;🎉 잘했어요!&#x27;,&#x27;👏 최고예요!&#x27;,&#x27;🌟 맞았어요!&#x27;,&#x27;😊 멋져요!&#x27;];

const S={range:30,sound:true,fx:true,voice:&#x27;&#x27;,rate:0.9};
try{let r=Number(localStorage.getItem(&#x27;t10-range&#x27;));if(r===99)r=90;if([20,30,50,90].includes(r))S.range=r;
    const f=localStorage.getItem(&#x27;t10-fx&#x27;);if(f!==null)S.fx=f===&#x27;1&#x27;;
    S.voice=localStorage.getItem(&#x27;t10-voice&#x27;)||&#x27;&#x27;;
    const rt=Number(localStorage.getItem(&#x27;t10-rate&#x27;));if([0.75,0.9,1.05].includes(rt))S.rate=rt;
    const s=localStorage.getItem(&#x27;t10-sound&#x27;);if(s!==null)S.sound=s===&#x27;1&#x27;;}catch(e){}

let lastSpeech=&#x27;&#x27;;
/* ---------- 목소리 고르기 ---------- */
let koVoices=[];
function voiceScore(v){
  const n=v.name;let sc=0;
  if(/Natural|Neural/i.test(n))sc+=60;          /* Edge의 자연스러운 목소리 */
  if(/Premium|Enhanced|고급|향상/i.test(n))sc+=50; /* Apple 고급 목소리 */
  if(/Online/i.test(n))sc+=20;
  if(/Google/i.test(n))sc+=35;                   /* Chrome의 Google 목소리 */
  if(/Yuna|유나|SunHi|선희|Heami|해미|InJoon|인준|Hyunsu|Sora/i.test(n))sc+=15;
  return sc;
}
function bestVoice(){
  if(!koVoices.length)return null;
  const chosen=koVoices.find(v=&gt;v.voiceURI===S.voice);
  if(chosen)return chosen;
  return [...koVoices].sort((a,b)=&gt;voiceScore(b)-voiceScore(a))[0];
}
function loadVoices(){
  try{koVoices=speechSynthesis.getVoices().filter(v=&gt;/^ko/i.test(v.lang)||/Korean|한국/i.test(v.name));}catch(e){koVoices=[];}
  const sel=$(&#x27;voice-sel&#x27;);sel.innerHTML=&#x27;&#x27;;
  const auto=document.createElement(&#x27;option&#x27;);auto.value=&#x27;&#x27;;auto.textContent=&#x27;자동 (가장 자연스러운 목소리)&#x27;;sel.appendChild(auto);
  [...koVoices].sort((a,b)=&gt;voiceScore(b)-voiceScore(a)).forEach(v=&gt;{const o=document.createElement(&#x27;option&#x27;);o.value=v.voiceURI;o.textContent=v.name;sel.appendChild(o);});
  sel.value=koVoices.some(v=&gt;v.voiceURI===S.voice)?S.voice:&#x27;&#x27;;
  const b=bestVoice();
  $(&#x27;voice-note&#x27;).textContent=!(&#x27;speechSynthesis&#x27; in window)?&#x27;이 브라우저는 목소리 기능을 지원하지 않아요.&#x27;
    :koVoices.length?`지금 쓰는 목소리: ${b.name}`:&#x27;이 기기에서 한국어 목소리를 찾지 못했어요. 엣지(Edge)나 크롬(Chrome)에서 열어 보세요.&#x27;;
}
try{if(&#x27;speechSynthesis&#x27; in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}}catch(e){}

function say(text){
  lastSpeech=text;
  if(!S.sound)return;
  try{
    if(!(&#x27;speechSynthesis&#x27; in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=bestVoice();if(v)u.voice=v;
    u.lang=v?v.lang:&#x27;ko-KR&#x27;;u.rate=S.rate;u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 효과음 (따로 파일 없이 브라우저에서 만들어요) ---------- */
let actx=null;
function ac(){
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}
  if(actx.state===&#x27;suspended&#x27;)actx.resume();
  return actx;
}
function tone(freq,start,dur,type,vol,slideTo){
  const c=ac();if(!c)return;
  const t=c.currentTime+start,o=c.createOscillator(),g=c.createGain();
  o.type=type||&#x27;sine&#x27;;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
const SFX={
  pop(){tone(520,0,0.13,&#x27;sine&#x27;,0.3,880);},                          /* 톡: 누를 때 */
  block(){tone(260,0,0.12,&#x27;triangle&#x27;,0.4,180);tone(130,0,0.1,&#x27;sine&#x27;,0.25);}, /* 탁: 블록 놓기 */
  remove(){tone(700,0,0.14,&#x27;sine&#x27;,0.2,350);},                       /* 쏙: 빼기 */
  right(){[523,659,784].forEach((f,i)=&gt;tone(f,i*0.11,0.3,&#x27;triangle&#x27;,0.28));}, /* 딩동댕 */
  wrong(){tone(330,0,0.2,&#x27;sine&#x27;,0.15,262);},                        /* 부드러운 뿅 */
  bundle(){[392,523,659,784].forEach((f,i)=&gt;tone(f,i*0.08,0.22,&#x27;triangle&#x27;,0.25));tone(1047,0.34,0.4,&#x27;sine&#x27;,0.2);},
  fanfare(){[523,523,659,784,659,784,1047].forEach((f,i)=&gt;tone(f,[0,.15,.3,.45,.65,.8,1][i],i===6?0.6:0.18,&#x27;triangle&#x27;,0.28));}
};
function sfx(name){if(!S.fx)return;try{SFX[name]();}catch(e){}}

function show(text,speak){ /* 화면 문장 + 소리 */

}

/* 3지선다: 정답이 맞을 때까지 다시 고를 수 있어요 */
function makeChoices(box,list,answer,onRight,fmt){
  box.innerHTML=&#x27;&#x27;;let done=false,miss=0;
  list.forEach(v=&gt;{
    const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;choice&#x27;;b.textContent=fmt?fmt(v):v;
    b.addEventListener(&#x27;click&#x27;,()=&gt;{
      if(done||b.classList.contains(&#x27;nope&#x27;))return;
      say(String(v));
      if(v===answer){done=true;b.classList.add(&#x27;right&#x27;);onRight(miss===0);}
      else{miss++;sfx(&#x27;wrong&#x27;);b.classList.add(&#x27;nope&#x27;);setTimeout(()=&gt;show(&#x27;다시 골라 볼까요?&#x27;),500);}
    });
    box.appendChild(b);
  });
}
function threeOpts(n,max,step){
  const s=new Set([n]);const a=Math.floor(n/10),b=n%10;
  const c=step===10?[n+10,n-10,n+20,n-20]:[n+10,n-10,b*10+a,n+1,n-1];
  const cap=Math.min(90,Math.max(max,30));
  for(const x of shuffle(c)){if(s.size&gt;=3)break;if(x&gt;=1&amp;&amp;x&lt;=cap&amp;&amp;x!==n)s.add(x);}
  while(s.size&lt;3)s.add(step===10?rand(1,cap/10)*10:rand(10,cap));
  return [...s].sort((x,y)=&gt;x-y);
}

&lt;script&gt;
/* ---------- 도구 ---------- */
const $=s=&gt;document.getElementById(s);
const shuffle=a=&gt;{for(let i=a.length-1;i&gt;0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY=&#x27;chart50-&#x27;;
/* 단계: 빈칸 개수, 친구 캐릭터, 색 (단계가 올라갈수록 빈칸이 많아져요) */
const STAGES=[
  {n:5, ch:&#x27;🐣&#x27;,name:&#x27;병아리&#x27;,c:&#x27;#FFD866&#x27;},
  {n:10,ch:&#x27;🐰&#x27;,name:&#x27;토끼&#x27;,c:&#x27;#FFB3CF&#x27;},
  {n:20,ch:&#x27;🐻&#x27;,name:&#x27;곰&#x27;,c:&#x27;#E2C29F&#x27;},
  {n:30,ch:&#x27;🦊&#x27;,name:&#x27;여우&#x27;,c:&#x27;#FFB98A&#x27;},
  {n:40,ch:&#x27;🦁&#x27;,name:&#x27;사자&#x27;,c:&#x27;#A9D8FF&#x27;}
];
const PRAISE=[&#x27;잘했어요&#x27;,&#x27;최고예요&#x27;,&#x27;멋져요&#x27;,&#x27;딩동댕&#x27;];

const S={opts:3,hint:true,sound:true,fx:true,voice:&#x27;&#x27;,rate:0.9,cleared:[]};
try{
  const o=Number(localStorage.getItem(KEY+&#x27;opts&#x27;));if([2,3].includes(o))S.opts=o;
  const h=localStorage.getItem(KEY+&#x27;hint&#x27;);if(h!==null)S.hint=h===&#x27;1&#x27;;
  const s=localStorage.getItem(KEY+&#x27;sound&#x27;);if(s!==null)S.sound=s===&#x27;1&#x27;;
  const f=localStorage.getItem(KEY+&#x27;fx&#x27;);if(f!==null)S.fx=f===&#x27;1&#x27;;
  S.voice=localStorage.getItem(KEY+&#x27;voice&#x27;)||&#x27;&#x27;;
  const rt=Number(localStorage.getItem(KEY+&#x27;rate&#x27;));if([0.75,0.9,1.05].includes(rt))S.rate=rt;
  const c=JSON.parse(localStorage.getItem(KEY+&#x27;cleared&#x27;)||&#x27;[]&#x27;);if(Array.isArray(c))S.cleared=c.filter(x=&gt;Number.isInteger(x));
}catch(e){}
function save(k,v){try{localStorage.setItem(KEY+k,typeof v===&#x27;string&#x27;?v:JSON.stringify(v));}catch(e){}}

/* ---------- 목소리 ---------- */
let lastSpeech=&#x27;&#x27;,koVoices=[];
function voiceScore(v){
  const n=v.name;let sc=0;
  if(/Natural|Neural/i.test(n))sc+=60;
  if(/Premium|Enhanced|고급|향상/i.test(n))sc+=50;
  if(/Online/i.test(n))sc+=20;
  if(/Google/i.test(n))sc+=35;
  if(/Yuna|유나|SunHi|선희|Heami|해미|InJoon|인준|Hyunsu|Sora/i.test(n))sc+=15;
  return sc;
}
function bestVoice(){
  if(!koVoices.length)return null;
  return koVoices.find(v=&gt;v.voiceURI===S.voice)||[...koVoices].sort((a,b)=&gt;voiceScore(b)-voiceScore(a))[0];
}
function loadVoices(){
  try{koVoices=speechSynthesis.getVoices().filter(v=&gt;/^ko/i.test(v.lang)||/Korean|한국/i.test(v.name));}catch(e){koVoices=[];}
  const sel=$(&#x27;voice-sel&#x27;);sel.innerHTML=&#x27;&#x27;;
  const auto=document.createElement(&#x27;option&#x27;);auto.value=&#x27;&#x27;;auto.textContent=&#x27;자동 (가장 자연스러운 목소리)&#x27;;sel.appendChild(auto);
  [...koVoices].sort((a,b)=&gt;voiceScore(b)-voiceScore(a)).forEach(v=&gt;{const o=document.createElement(&#x27;option&#x27;);o.value=v.voiceURI;o.textContent=v.name;sel.appendChild(o);});
  sel.value=koVoices.some(v=&gt;v.voiceURI===S.voice)?S.voice:&#x27;&#x27;;
  const b=bestVoice();
  $(&#x27;voice-note&#x27;).textContent=!(&#x27;speechSynthesis&#x27; in window)?&#x27;이 브라우저는 목소리 기능을 지원하지 않아요.&#x27;
    :b?`지금 쓰는 목소리: ${b.name}`:&#x27;이 기기에서 한국어 목소리를 찾지 못했어요. 엣지(Edge)나 크롬(Chrome)에서 열어 보세요.&#x27;;
}
try{if(&#x27;speechSynthesis&#x27; in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}}catch(e){}
function say(text){
  lastSpeech=text;
  if(!S.sound)return;
  try{
    if(!(&#x27;speechSynthesis&#x27; in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=bestVoice();if(v)u.voice=v;
    u.lang=v?v.lang:&#x27;ko-KR&#x27;;u.rate=S.rate;u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 효과음 ---------- */
let actx=null;
function ac(){
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}
  if(actx.state===&#x27;suspended&#x27;)actx.resume();
  return actx;
}
function tone(freq,start,dur,type,vol,slideTo){
  const c=ac();if(!c)return;
  const t=c.currentTime+start,o=c.createOscillator(),g=c.createGain();
  o.type=type||&#x27;sine&#x27;;o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
const SFX={
  pop(){tone(520,0,0.13,&#x27;sine&#x27;,0.3,880);},
  fill(){tone(880,0,0.12,&#x27;triangle&#x27;,0.26);tone(1175,0.08,0.14,&#x27;triangle&#x27;,0.22);tone(1568,0.16,0.22,&#x27;sine&#x27;,0.14);}, /* 반짝 */
  hop(){tone(350,0,0.16,&#x27;sine&#x27;,0.22,800);},
  wrong(){tone(330,0,0.2,&#x27;sine&#x27;,0.15,262);},
  right(){[523,659,784].forEach((f,i)=&gt;tone(f,i*0.11,0.3,&#x27;triangle&#x27;,0.28));},
  fanfare(){[523,523,659,784,659,784,1047].forEach((f,i)=&gt;tone(f,[0,.15,.3,.45,.65,.8,1][i],i===6?0.6:0.18,&#x27;triangle&#x27;,0.28));}
};
function sfx(n){if(!S.fx)return;try{SFX[n]();}catch(e){}}
let partyTimer=null;
function party(msg,snd){
  sfx(snd||&#x27;right&#x27;);
  const p=$(&#x27;party&#x27;);$(&#x27;party-text&#x27;).textContent=msg;
  p.classList.add(&#x27;show&#x27;);clearTimeout(partyTimer);
  partyTimer=setTimeout(()=&gt;p.classList.remove(&#x27;show&#x27;),1800);
}
function confetti(){
  if(window.matchMedia&amp;&amp;matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches)return;
  const colors=[&#x27;#FF7AA8&#x27;,&#x27;#7CC6FE&#x27;,&#x27;#FFD866&#x27;,&#x27;#B18CFF&#x27;,&#x27;#6EE0A2&#x27;];
  for(let i=0;i&lt;40;i++){
    const c=document.createElement(&#x27;div&#x27;);c.className=&#x27;confetti&#x27;;
    c.style.left=Math.random()*100+&#x27;vw&#x27;;c.style.background=colors[i%colors.length];
    c.style.setProperty(&#x27;--x&#x27;,(Math.random()*120-60)+&#x27;px&#x27;);c.style.setProperty(&#x27;--d&#x27;,(1.6+Math.random()*1.2)+&#x27;s&#x27;);
    c.style.animationDelay=(Math.random()*0.4)+&#x27;s&#x27;;
    document.body.appendChild(c);setTimeout(()=&gt;c.remove(),3400);
  }
}

/* ---------- 화면 이동 ---------- */
function go(id){

document.querySelectorAll(&#x27;[data-go]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{sfx(&#x27;pop&#x27;);go(b.dataset.go);}));

/* ---------- 단계 지도 ---------- */
function paintMap(){
  const box=$(&#x27;map&#x27;);box.innerHTML=&#x27;&#x27;;

    const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;stage&#x27;;

    b.setAttribute(&#x27;aria-label&#x27;,`${i+1}단계, 빈칸 ${s.n}개${S.cleared.includes(i)?&#x27;, 완료&#x27;:&#x27;&#x27;}`);

/* ---------- 풀기 ---------- */
const st={level:0,blanks:[],idx:0,filled:new Set()};
let gameId=0; /* 화면을 떠나면 예약된 다음 문제를 취소해요 */
function startLevel(l){
  gameId++;
  st.level=l;st.idx=0;st.filled=new Set();
  const all=[];for(let n=1;n&lt;=50;n++)all.push(n);
  st.blanks=shuffle(all).slice(0,STAGES[l].n).sort((a,b)=&gt;a-b);
  $(&#x27;play-title&#x27;).textContent=`${STAGES[l].ch} ${l+1}단계`;
  $(&#x27;prog-walker&#x27;).textContent=STAGES[l].ch;
  $(&#x27;endbtns&#x27;).hidden=true;
  go(&#x27;play&#x27;);
  renderBoard();ask();
}
function renderBoard(popN,hop){
  const cur=st.blanks[st.idx];
  const box=$(&#x27;board&#x27;);box.innerHTML=&#x27;&#x27;;
  for(let n=1;n&lt;=50;n++){
    const c=document.createElement(&#x27;button&#x27;);c.className=&#x27;cell&#x27;;
    const isBlank=st.blanks.includes(n);
    if(isBlank&amp;&amp;!st.filled.has(n)){
      /* 빈칸은 비워 두고, 지금 채울 칸은 테두리가 반짝여요 */
      c.classList.add(n===cur?&#x27;cur&#x27;:&#x27;empty&#x27;);
      c.setAttribute(&#x27;aria-label&#x27;,n===cur?&#x27;지금 채울 칸&#x27;:&#x27;빈칸&#x27;);
    }else{
      c.textContent=n;
      if(st.filled.has(n))c.classList.add(&#x27;got&#x27;);
      if(S.hint&amp;&amp;cur&amp;&amp;n===cur-1)c.classList.add(&#x27;hint&#x27;);
      if(n===popN){c.classList.add(&#x27;pop&#x27;);const sp=document.createElement(&#x27;span&#x27;);sp.className=&#x27;spark&#x27;;sp.textContent=&#x27;✨&#x27;;c.appendChild(sp);}
    }
    /* 친구 캐릭터: 지금 칸 바로 앞의 수 위에 서 있어요 (1번 칸이면 지금 칸 위) */
    const buddyAt=S.hint?(cur===1?1:cur-1):cur;
    if(cur&amp;&amp;n===buddyAt){const b=document.createElement(&#x27;span&#x27;);b.className=&#x27;buddy&#x27;+(hop?&#x27; hop&#x27;:&#x27;&#x27;);b.textContent=STAGES[st.level].ch;c.appendChild(b);}
    c.addEventListener(&#x27;click&#x27;,()=&gt;{
      if(c.classList.contains(&#x27;cur&#x27;))say(lastSpeech);
      else if(!c.classList.contains(&#x27;empty&#x27;))say(String(n));
    });
    box.appendChild(c);
  }
  const total=st.blanks.length,done=st.filled.size,pct=total?done/total*100:0;
  $(&#x27;prog-fill&#x27;).style.width=pct+&#x27;%&#x27;;$(&#x27;prog-walker&#x27;).style.left=pct+&#x27;%&#x27;;
}
function makeOpts(n){
  const s=new Set([n]);
  const near=shuffle([n-1,n+1]),far=shuffle([n+10,n-10]);
  for(const x of [...near,...far,n+2,n-2]){if(s.size&gt;=S.opts)break;if(x&gt;=1&amp;&amp;x&lt;=50)s.add(x);}
  return [...s].sort((a,b)=&gt;a-b);
}
function ask(){
  const n=st.blanks[st.idx];
  if(n===1){
    $(&#x27;play-say&#x27;).innerHTML=&#x27;&lt;b&gt;첫 번째&lt;/b&gt; 칸에 들어갈 수는?&#x27;;
    say(&#x27;첫 번째 칸에 들어갈 수는 무엇일까요?&#x27;);
  }else{
    $(&#x27;play-say&#x27;).innerHTML=`&lt;b&gt;${n-1}&lt;/b&gt; 다음 수는?`;
    say(`${n-1} 다음 수는 무엇일까요?`);
  }
  const box=$(&#x27;choices&#x27;);box.innerHTML=&#x27;&#x27;;let done=false,miss=0;
  const myGame=gameId;
  makeOpts(n).forEach(v=&gt;{
    const b=document.createElement(&#x27;button&#x27;);b.className=&#x27;choice&#x27;;b.textContent=v;
    b.addEventListener(&#x27;click&#x27;,()=&gt;{
      if(done||b.classList.contains(&#x27;nope&#x27;))return;
      if(v===n){
        done=true;b.classList.add(&#x27;right&#x27;);sfx(&#x27;fill&#x27;);say(String(n));
        {const m=reward(miss===0);if(m)party(m,&#x27;pop&#x27;);}
        st.filled.add(n);st.idx++;
        renderBoard(n);
        setTimeout(()=&gt;{
          if(myGame!==gameId)return;
          if(st.idx&gt;=st.blanks.length){finish();return;}
          sfx(&#x27;hop&#x27;);renderBoard(null,true);ask();
        },900);
      }else{miss++;sfx(&#x27;wrong&#x27;);b.classList.add(&#x27;nope&#x27;);say(&#x27;다시 골라 볼까요?&#x27;);}
    });
    box.appendChild(b);
  });
}
function finish(){
  $(&#x27;choices&#x27;).innerHTML=&#x27;&#x27;;
  renderBoard();
  if(!S.cleared.includes(st.level)){S.cleared.push(st.level);save(&#x27;cleared&#x27;,S.cleared);}
  const s=STAGES[st.level];
  party(`${s.ch} 다 채웠어요! 보너스 별 3개`,&#x27;fanfare&#x27;);confetti();setTimeout(()=&gt;addStars(3),700);
  $(&#x27;play-say&#x27;).textContent=&#x27;숫자 마을을 다 채웠어요!&#x27;;
  const ga=(s.name.charCodeAt(s.name.length-1)-0xAC00)%28?&#x27;이&#x27;:&#x27;가&#x27;;

}
$(&#x27;btn-next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{sfx(&#x27;pop&#x27;);startLevel(Math.min(st.level+1,STAGES.length-1));});
$(&#x27;btn-again&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{sfx(&#x27;pop&#x27;);startLevel(st.level);});

/* ---------- 설정 ---------- */
function paint(){
  document.querySelectorAll(&#x27;[data-opts]&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,+b.dataset.opts===S.opts));
  document.querySelectorAll(&#x27;[data-hint]&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,(b.dataset.hint===&#x27;1&#x27;)===S.hint));
  document.querySelectorAll(&#x27;[data-sound]&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,(b.dataset.sound===&#x27;1&#x27;)===S.sound));
  document.querySelectorAll(&#x27;[data-fx]&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,(b.dataset.fx===&#x27;1&#x27;)===S.fx));
  document.querySelectorAll(&#x27;[data-rate]&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;on&#x27;,+b.dataset.rate===S.rate));
}
document.querySelectorAll(&#x27;[data-opts]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{S.opts=+b.dataset.opts;save(&#x27;opts&#x27;,String(S.opts));paint();}));
document.querySelectorAll(&#x27;[data-hint]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{S.hint=b.dataset.hint===&#x27;1&#x27;;save(&#x27;hint&#x27;,S.hint?&#x27;1&#x27;:&#x27;0&#x27;);paint();}));
document.querySelectorAll(&#x27;[data-sound]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{S.sound=b.dataset.sound===&#x27;1&#x27;;save(&#x27;sound&#x27;,S.sound?&#x27;1&#x27;:&#x27;0&#x27;);paint();if(S.sound)say(&#x27;목소리를 켰어요&#x27;);}));
document.querySelectorAll(&#x27;[data-fx]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{S.fx=b.dataset.fx===&#x27;1&#x27;;save(&#x27;fx&#x27;,S.fx?&#x27;1&#x27;:&#x27;0&#x27;);paint();sfx(&#x27;right&#x27;);}));
document.querySelectorAll(&#x27;[data-rate]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{S.rate=+b.dataset.rate;save(&#x27;rate&#x27;,String(S.rate));paint();say(&#x27;이 빠르기로 말할게요.&#x27;);}));
$(&#x27;voice-sel&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{S.voice=e.target.value;save(&#x27;voice&#x27;,S.voice);loadVoices();say(&#x27;안녕하세요. 숫자 마을에 놀러 갈까요?&#x27;);});
$(&#x27;voice-test&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;say(&#x27;안녕하세요. 스물셋 다음은 스물넷. 잘했어요!&#x27;));
let resetArmed=false;
$(&#x27;reset-btn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  const b=$(&#x27;reset-btn&#x27;);
  if(!resetArmed){resetArmed=true;b.textContent=&#x27;한 번 더 누르면 지워져요&#x27;;setTimeout(()=&gt;{resetArmed=false;b.textContent=&#x27;완료 표시 지우기&#x27;;},4000);return;}
  resetArmed=false;S.cleared=[];save(&#x27;cleared&#x27;,S.cleared);b.textContent=&#x27;지웠어요&#x27;;
  setTimeout(()=&gt;{b.textContent=&#x27;완료 표시 지우기&#x27;;},2000);
});
paint();paintMap();

/* ---------- 별 모으기 (강화) ---------- */
let stars=0,streak=0;
try{const v=Number(localStorage.getItem(&#x27;chart50-stars&#x27;));if(v&gt;0)stars=v;}catch(e){}
function paintBars(bump){
  document.querySelectorAll(&#x27;.star-count&#x27;).forEach(e=&gt;{e.textContent=stars;if(bump){const p=e.parentElement;p.classList.remove(&#x27;bump&#x27;);void p.offsetWidth;p.classList.add(&#x27;bump&#x27;);}});
}
function addStars(n){stars+=n;try{localStorage.setItem(&#x27;chart50-stars&#x27;,String(stars));}catch(e){}paintBars(true);}
/* 정답 보상: 별 1개, 처음 고른 답으로 3번 연속 맞히면 별 2개. 칭찬 문구를 돌려줘요 */
function reward(firstTry){
  let add=1,msg=null;
  if(firstTry){streak++;if(streak%3===0){add=2;msg=&#x27;🔥 3번 연속! 별 2개!&#x27;;}}else streak=0;
  setTimeout(()=&gt;addStars(add),400);
  return msg;
}
(function(){
  const b=document.getElementById(&#x27;star-reset&#x27;);if(!b)return;let armed=false;
  b.addEventListener(&#x27;click&#x27;,()=&gt;{
    if(!armed){armed=true;b.textContent=&#x27;한 번 더 누르면 지워져요&#x27;;setTimeout(()=&gt;{armed=false;b.textContent=&#x27;별 지우기&#x27;;},4000);return;}
    armed=false;stars=0;streak=0;try{localStorage.setItem(&#x27;chart50-stars&#x27;,&#x27;0&#x27;);}catch(e){}paintBars();b.textContent=&#x27;지웠어요&#x27;;
    setTimeout(()=&gt;{b.textContent=&#x27;별 지우기&#x27;;},2000);
  });
  paintBars();
})();

/* 묶음 파일용: 목소리·효과음·빠르기·목소리 선택을 세 앱이 함께 쓰도록 맞춰요 */
(function(){
  var APP=&quot;chart&quot;;
  function store(k,v){
    try{
      if(APP===&#x27;tens&#x27;){localStorage.setItem(&#x27;t10-&#x27;+k,(k===&#x27;sound&#x27;||k===&#x27;fx&#x27;)?(v?&#x27;1&#x27;:&#x27;0&#x27;):String(v));}
      else if(APP===&#x27;order&#x27;){save(k,(k===&#x27;sound&#x27;||k===&#x27;fx&#x27;)?(v?1:0):v);}
      else{save(k,(k===&#x27;sound&#x27;||k===&#x27;fx&#x27;)?(v?&#x27;1&#x27;:&#x27;0&#x27;):String(v));}
    }catch(e){}
  }
  function snapshot(){return {sound:S.sound,fx:S.fx,rate:S.rate,voice:S.voice};}
  function send(){try{parent.postMessage({suite:&#x27;set&#x27;,from:APP,v:snapshot()},&#x27;*&#x27;);}catch(e){}}
  function later(){setTimeout(send,0);}
  var toast=document.createElement(&#x27;div&#x27;);
  toast.style.cssText=&quot;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2F9E5B;color:#fff;padding:10px 22px;border-radius:999px;font-size:20px;font-family:&#x27;Apple SD Gothic Neo&#x27;,&#x27;Malgun Gothic&#x27;,sans-serif;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;z-index:99&quot;;
  document.body.appendChild(toast);var tt=null;
  function done(b){var lab=(b.textContent||&#x27;&#x27;).replace(&#x27;✔&#x27;,&#x27;&#x27;).trim();toast.textContent=&#x27;✔ \u2018&#x27;+lab+&#x27;\u2019 선택했어요&#x27;;toast.style.opacity=&#x27;1&#x27;;clearTimeout(tt);tt=setTimeout(function(){toast.style.opacity=&#x27;0&#x27;;},1400);}
  document.addEventListener(&#x27;click&#x27;,function(e){var b=e.target.closest&amp;&amp;e.target.closest(&#x27;#settings .pill&#x27;);if(b&amp;&amp;b.id!==&#x27;voice-test&#x27;&amp;&amp;b.id!==&#x27;reset-btn&#x27;)setTimeout(function(){done(b);},0);},true);
  document.addEventListener(&#x27;click&#x27;,function(e){
    var t=e.target.closest&amp;&amp;e.target.closest(&#x27;[data-sound],[data-fx],[data-rate]&#x27;);if(t)later();
  },true);
  var sel=document.getElementById(&#x27;voice-sel&#x27;);if(sel)sel.addEventListener(&#x27;change&#x27;,later);
  window.addEventListener(&#x27;message&#x27;,function(e){
    var d=e.data;if(!d||d.suite!==&#x27;apply&#x27;)return;
    try{
      [&#x27;sound&#x27;,&#x27;fx&#x27;,&#x27;rate&#x27;,&#x27;voice&#x27;].forEach(function(k){if(d.v[k]!==undefined&amp;&amp;S[k]!==d.v[k]){S[k]=d.v[k];store(k,d.v[k]);}});
      paint();
      if(typeof loadVoices===&#x27;function&#x27;)loadVoices();
      if(!S.sound){try{speechSynthesis.cancel();}catch(e){}}
    }catch(err){}
  });
  /* 처음 열 때 다른 앱과 맞추기 */
  try{parent.postMessage({suite:&#x27;hello&#x27;,from:APP},&#x27;*&#x27;);}catch(e){}
  var note=document.querySelector(&#x27;#settings .set-list, .set-list&#x27;);
  if(note){var p=document.createElement(&#x27;p&#x27;);p.style.cssText=&quot;margin:0;font-size:15px;opacity:.75;font-family:&#x27;Apple SD Gothic Neo&#x27;,&#x27;Malgun Gothic&#x27;,sans-serif;font-weight:500&quot;;
    p.textContent=&#x27;※ 목소리 안내, 목소리 고르기, 말 빠르기, 효과음은 세 가지 놀이에 함께 적용돼요.&#x27;;note.insertBefore(p,note.firstChild);}
})();

<script>
const tabs=[...document.querySelectorAll('.tab')];
const frames=[...document.querySelectorAll('iframe')];
let shared=null; /* 세 앱이 함께 쓰는 소리 설정 */
function stopSpeech(){try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  frames.forEach(f=>{try{f.contentWindow.speechSynthesis.cancel();}catch(e){}});}
window.addEventListener('message',e=>{
  const d=e.data;if(!d||!d.suite)return;
  const src=frames.find(f=>f.contentWindow===e.source);if(!src)return;
  if(d.suite==='set'){
    shared=d.v;
    frames.forEach(f=>{if(f!==src)try{f.contentWindow.postMessage({suite:'apply',v:shared},'*');}catch(err){}});
  }else if(d.suite==='hello'&&shared){
    try{src.contentWindow.postMessage({suite:'apply',v:shared},'*');}catch(err){}
  }
});
function open(id){
  stopSpeech();
  tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.app===id?'true':'false'));
  frames.forEach(f=>f.hidden=f.id!=='app-'+id);
  document.getElementById('cover').hidden=id!=='cover';
  }
tabs.forEach(t=>t.addEventListener('click',()=>open(t.dataset.app)));
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>open(c.dataset.app)));
open('cover'); /* 처음에는 표지가 나와요 */
</script>
